<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SwiftMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-secondary: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.05);
            border: 1px solid var(--border-color);
        }
        .auth-header { text-align: center; margin-bottom: 32px; }
        .auth-header h1 { font-size: 1.5rem; color: var(--brand-primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .auth-header p { color: var(--text-muted); font-size: 0.95rem; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; outline: none; transition: all 0.2s;
        }
        .form-group input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .submit-btn {
            width: 100%; background: var(--brand-primary); color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .submit-btn:hover { background: var(--brand-secondary); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }
        
        .auth-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.9rem; }
        .auth-footer a { color: var(--brand-primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        
        /* NEW: Jumia Footer Link Style */
        .jumia-footer-link { 
            text-align: center; 
            margin-top: 24px; 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }
        .jumia-footer-link a { 
            color: #f57c00; 
            text-decoration: none; 
            font-weight: 600; 
        }
        .jumia-footer-link a:hover { text-decoration: underline; }
        
        .error-msg { background: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; text-align: center; border: 1px solid #fecaca; font-size: 0.875rem; }
        .success-msg { background: #ecfdf5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; text-align: center; border: 1px solid #a7f3d0; font-size: 0.875rem; }

        /* Spinner */
        .spinner { 
            width: 18px; height: 18px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 50%; 
            border-top-color: white; 
            animation: spin 1s linear infinite; 
            display: inline-block; 
            vertical-align: middle; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1>⚡ SwiftMart</h1>
            <p>Create an account to start shopping</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="2547XXXXXXXX" pattern="[0-9]{12}" title="Please enter a 12-digit number starting with 254 (e.g., 254712345678)">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6">
            </div>
            <button type="submit" class="submit-btn" id="registerBtn">Create Account</button>
        </form>
        
        <div class="auth-footer">
            Already have an account? <a href="/login">Login here</a>
        </div>

        <!-- NEW: Jumia Affiliate Footer Link -->
        <div class="jumia-footer-link">
            &copy; 2026 SwiftMart. All rights reserved. | <a href="https://jforce.jumia.co.ke/s/HhGX6Ds" target="_blank">Shop on Jumia</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const registerBtn = document.getElementById('registerBtn');
            
            // Reset messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            // Show loading state
            registerBtn.disabled = true;
            registerBtn.innerHTML = '<span class="spinner"></span> Creating account...';
            
            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password }),
                    credentials: 'include' // ADDED: Ensures session cookie is handled properly
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    successMsg.innerHTML = '✅ Account created successfully!<br>Please check your email to verify your account.';
                    successMsg.style.display = 'block';
                    
                    // Disable form to prevent double submission
                    registerBtn.innerHTML = '✅ Account Created';
                    
                    // Redirect to login page after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    errorMsg.textContent = data.error || 'Registration failed. Please try again.';
                    errorMsg.style.display = 'block';
                    registerBtn.disabled = false;
                    registerBtn.innerHTML = 'Create Account';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please check your connection and try again.';
                errorMsg.style.display = 'block';
                registerBtn.disabled = false;
                registerBtn.innerHTML = 'Create Account';
            }
        });
    </script>
</body>
</html>
