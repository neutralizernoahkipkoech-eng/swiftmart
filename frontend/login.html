<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SwiftMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-primary: #2563eb;
            --brand-secondary: #1e40af;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.05);
            border: 1px solid var(--border-color);
        }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header h1 { font-size: 1.5rem; color: var(--brand-primary); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .auth-header p { color: var(--text-muted); font-size: 0.95rem; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
            border-radius: 8px; font-size: 1rem; outline: none; transition: all 0.2s;
        }
        .form-group input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Form Options (Remember Me & Forgot Password) */
        .form-options { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            font-size: 0.875rem; 
        }
        .remember-me { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            color: var(--text-muted); 
            cursor: pointer; 
        }
        .remember-me input { cursor: pointer; accent-color: var(--brand-primary); }
        .forgot-link { 
            color: var(--brand-primary); 
            text-decoration: none; 
            font-weight: 500; 
        }
        .forgot-link:hover { text-decoration: underline; }

        .submit-btn {
            width: 100%; background: var(--brand-primary); color: white; border: none;
            padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.2s;
        }
        .submit-btn:hover { background: var(--brand-secondary); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        /* Social Login */
        .divider { 
            display: flex; 
            align-items: center; 
            margin: 24px 0; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
        }
        .divider::before, .divider::after { 
            content: ''; 
            flex: 1; 
            height: 1px; 
            background: var(--border-color); 
        }
        .divider span { padding: 0 12px; }
        
        .social-buttons { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .btn-social { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            background: white; 
            font-size: 0.95rem; 
            font-weight: 500; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            transition: all 0.2s; 
            color: var(--text-main);
        }
        .btn-social:hover { background: var(--bg-color); border-color: #cbd5e1; }
        .btn-google i { color: #ea4335; }
        .btn-facebook i { color: #1877f2; }

        .auth-footer { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 0.9rem; }
        .auth-footer a { color: var(--brand-primary); text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        
        .error-msg { background: #fef2f2; color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; text-align: center; border: 1px solid #fecaca; font-size: 0.875rem; }
        .success-msg { background: #ecfdf5; color: #065f46; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; text-align: center; border: 1px solid #a7f3d0; font-size: 0.875rem; }

        /* Spinner */
        .spinner { 
            width: 18px; height: 18px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-radius: 50%; 
            border-top-color: white; 
            animation: spin 1s linear infinite; 
            display: inline-block; 
            vertical-align: middle; 
            margin-right: 8px; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Forgot Password Modal */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); 
            display: none; align-items: center; justify-content: center; 
            z-index: 1000; padding: 20px; backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal { 
            background: white; border-radius: 16px; padding: 32px; 
            max-width: 400px; width: 100%; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .modal h3 { margin-bottom: 12px; color: var(--text-main); font-size: 1.25rem; }
        .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; line-height: 1.5; }
        .modal-close { 
            position: absolute; top: 16px; right: 16px;
            background: none; border: none; font-size: 1.5rem; 
            cursor: pointer; color: var(--text-muted); transition: color 0.2s; 
        }
        .modal-close:hover { color: var(--text-main); }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <h1>⚡ SwiftMart</h1>
            <p>Welcome back! Please login to your account.</p>
        </div>
        
        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            
            <!-- Remember Me & Forgot Password -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="#" class="forgot-link" onclick="openForgotModal(event)">Forgot password?</a>
            </div>
            
            <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        </form>
        
        <!-- Social Login -->
        <div class="divider"><span>or continue with</span></div>
        
        <div class="social-buttons">
            <!-- UPDATED: This now actually redirects to Google OAuth -->
            <button class="btn-social btn-google" onclick="window.location.href='/api/auth/google'">
                <i class="fab fa-google"></i> Continue with Google
            </button>
            <button class="btn-social btn-facebook" onclick="socialLogin('facebook')">
                <i class="fab fa-facebook"></i> Continue with Facebook
            </button>
        </div>
        
        <div class="auth-footer">
            Don't have an account? <a href="/register">Register here</a>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div class="modal-overlay" id="forgotModal">
        <div class="modal">
            <button class="modal-close" onclick="closeForgotModal()">×</button>
            <h3>Reset Your Password</h3>
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <div id="forgotErrorMsg" class="error-msg"></div>
            <div id="forgotSuccessMsg" class="success-msg"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" required placeholder="you@example.com">
                </div>
                <button type="submit" class="submit-btn" id="forgotBtn">Send Reset Link</button>
            </form>
        </div>
    </div>

    <script>
        // --- Existing Login Logic (Enhanced with loading state & rememberMe) ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const loginBtn = document.getElementById('loginBtn');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, rememberMe })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    successMsg.textContent = '✅ Login successful! Redirecting...';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    errorMsg.textContent = data.error || 'Invalid email or password';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Login';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login';
            }
        });
        
        // --- Forgot Password Logic ---
        function openForgotModal(e) {
            e.preventDefault();
            document.getElementById('forgotModal').classList.add('active');
        }
        
        function closeForgotModal() {
            document.getElementById('forgotModal').classList.remove('active');
            document.getElementById('forgotErrorMsg').style.display = 'none';
            document.getElementById('forgotSuccessMsg').style.display = 'none';
        }
        
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const errorMsg = document.getElementById('forgotErrorMsg');
            const successMsg = document.getElementById('forgotSuccessMsg');
            const btn = document.getElementById('forgotBtn');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Sending...';
            
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                
                if (res.ok) {
                    successMsg.textContent = '✅ Reset link sent! Check your email.';
                    successMsg.style.display = 'block';
                    document.getElementById('forgotEmail').value = '';
                    setTimeout(() => closeForgotModal(), 2500);
                } else {
                    errorMsg.textContent = data.message || 'Email not found';
                    errorMsg.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = 'Send Reset Link';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error';
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link';
            }
        });
        
        // --- Social Login Placeholder (Kept for Facebook) ---
        function socialLogin(provider) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '⚙️ ' + provider + ' login coming soon! Please use email login for now.';
            errorMsg.style.background = '#eff6ff';
            errorMsg.style.color = '#1e40af';
            errorMsg.style.borderColor = '#bfdbfe';
            errorMsg.style.display = 'block';
        }
        
        // Close modal when clicking outside
        document.getElementById('forgotModal').addEventListener('click', function(e) {
            if (e.target === this) closeForgotModal();
        });
    </script>
</body>
</html>
